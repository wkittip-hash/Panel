<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riddle Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+Thai:wght@400;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #14151b;
  --panel: #1e2028;
  --panel-2: #282b35;
  --line: #3a3e4b;
  --fg: #eceef3;
  --muted: #9ca2b2;
  --ok: #4fd18b;
  --bad: #ff5a5f;
  --amber: #ffc24a;
  --stage: #3a1420;
  --stage-2: #1c0c12;
  --frog: #5cc46b;
  --frog-dark: #2f8a43;
  --display: "Chakra Petch", "IBM Plex Sans Thai", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c-red: #e84545;
  --c-blue: #3f7bea;
  --c-green: #2fb36b;
  --c-yellow: #f2c230;
  --c-purple: #9a5ae0;
  --c-orange: #f0802a;
  --c-pink: #f06aa8;
  --c-teal: #1fb5b0;
  --c-brown: #9a6a43;
  --c-white: #c9ccd6;
  --cream: #f4efe3;
  --cream-2: #e3dccb;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; }
.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
h1 span { color: var(--amber); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.ghost:hover:not(:disabled) { color: var(--fg); border-color: var(--muted); }
.ghost:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.stage {
  position: relative;
  border-radius: 14px;
  padding: 14px 16px;
  background: radial-gradient(ellipse at 18% 120%, color-mix(in srgb, var(--amber) 22%, transparent) 0 40%, transparent 70%), linear-gradient(180deg, var(--stage), var(--stage-2));
  display: flex;
  align-items: center;
  gap: 14px;
  overflow: hidden;
}
.stage::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 10px;
  background-image: radial-gradient(circle, var(--amber) 0 2.2px, transparent 2.8px);
  background-size: 18px 18px;
  -webkit-mask: linear-gradient(#000 0 0) top/100% 6px no-repeat, linear-gradient(#000 0 0) bottom/100% 6px no-repeat;
  mask: linear-gradient(#000 0 0) top/100% 6px no-repeat, linear-gradient(#000 0 0) bottom/100% 6px no-repeat;
  opacity: .8;
  animation: bulbs 1.6s steps(2) infinite;
  pointer-events: none;
}
@keyframes bulbs { 50% { opacity: .35; } }
.host { width: 92px; height: 92px; flex: none; position: relative; z-index: 1; }
.host svg { width: 100%; height: 100%; display: block; overflow: visible; }
.host.hop svg { animation: hop .5s ease-out; }
.host.sad svg { animation: droop .6s ease-out; }
@keyframes hop { 30% { transform: translateY(-14px) scale(1.04, .96); } 60% { transform: translateY(0) scale(.96, 1.04); } }
@keyframes droop { 40% { transform: rotate(-8deg) translateY(4px); } }
.lid { transform-origin: center; transform-box: fill-box; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
.bubble {
  position: relative;
  z-index: 1;
  flex: 1;
  min-width: 0;
  background: var(--fg);
  color: #1b1c22;
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 15px;
  line-height: 1.45;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right-color: var(--fg); }
.bubble .who { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7a3a1a; }

.status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--panel); padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lives { color: var(--bad); letter-spacing: .1em; }
.timebar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--amber); transition: width .1s linear; }
.timebar i.low { background: var(--bad); }

.section-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.rule {
  font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  line-height: 1.35; min-width: 0; transition: border-color .2s, background .2s;
}
.rule .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rule .riddle { font-style: italic; }
:lang(th) .rule .riddle { font-style: normal; }
.rule .plain { font-size: 12.5px; color: var(--muted); }
.rule .plain.hint { color: color-mix(in srgb, var(--amber) 70%, var(--muted)); }
.rule .plain.book { color: color-mix(in srgb, var(--ok) 70%, var(--muted)); }
.rule.shown { cursor: default; }
.rule:hover:not(.shown) { border-color: var(--muted); }
.rule .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.rule.done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.rule.done .mark { background: var(--ok); border-color: var(--ok); color: #0d1f15; }
.rule.broken { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel)); animation: shake .4s; }
.rule.broken .mark { background: var(--bad); border-color: var(--bad); color: #fff; }
.rule.new-type .riddle::after { content: attr(data-new); margin-left: 6px; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #2a1d00; background: var(--amber); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; white-space: nowrap; font-style: normal; vertical-align: middle; }
.mini { width: 22px; height: 22px; border-radius: 50%; background: var(--cream); border: 2px solid var(--sw, var(--c)); display: inline-grid; place-items: center; flex: none; overflow: hidden; }
.mini svg { width: 92%; height: 92%; display: block; }

.lineup { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slot {
  width: 48px; height: 58px; border-radius: 10px; border: 2px dashed var(--line);
  background: var(--panel-2); color: var(--muted); font: inherit; padding: 4px 0 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: default; position: relative;
}
.slot .n { font-family: var(--display); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.slot .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.slot.filled { border-style: solid; border-color: var(--muted); cursor: pointer; color: var(--fg); }
.slot.filled .dot .mini { width: 30px; height: 30px; }
.slot.next { border-color: var(--amber); color: var(--amber); }
.slot.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 22%, var(--panel-2)); animation: shake .4s; }
.slot.good { border-color: var(--ok); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lock {
  margin-left: auto; background: var(--amber); color: #2a1d00; border: 0; border-radius: 10px; padding: 10px 18px;
  font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 0 #a87a14;
}
.lock:disabled { opacity: .35; cursor: default; box-shadow: none; transform: translateY(3px); }
.lock:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #a87a14; }
.kbd { font-size: 12px; color: var(--muted); }
.kbd kbd { font-family: var(--display); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; }

.deck {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 16px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; min-height: 140px; align-content: center;
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0); background-size: 14px 14px;
}
.btn {
  --c: var(--c-red);
  width: 92px; border: 0; padding: 0; background: none; cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--fg); font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  transition: opacity .25s;
}
.btn .face {
  width: 82px; height: 82px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 40% 30%, #fffdf6, var(--cream) 60%, var(--cream-2));
  border: 5px solid var(--c);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 55%, #000), 0 10px 14px rgba(0,0,0,.45);
  display: grid; place-items: center; overflow: hidden;
  transition: transform .06s, box-shadow .06s;
}
.btn .face svg { width: 90%; height: 90%; display: block; }
:lang(th) .btn, :lang(th) .stat .k, :lang(th) .section-label { letter-spacing: 0; }
.btn:hover:not(:disabled) .face { transform: translateY(-2px) rotate(-3deg); }
.btn:active:not(:disabled) .face, .btn.press .face { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 55%, #000), 0 3px 6px rgba(0,0,0,.4); }
.btn:focus-visible { outline: none; }
.btn:focus-visible .face { outline: 3px solid var(--amber); outline-offset: 4px; }
.btn:disabled { cursor: default; opacity: .3; }
.btn:disabled .face { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 55%, #000); }
.btn .key { position: absolute; top: 66px; right: 2px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; padding: 0 5px; letter-spacing: 0; }
.btn .ord { position: absolute; top: -6px; right: 0; background: var(--fg); color: var(--bg); width: 24px; height: 24px; border-radius: 50%; font-size: 12px; display: grid; place-items: center; letter-spacing: 0; z-index: 1; }
@media (hover: none) { .btn .key, .kbd { display: none; } }

.overlay { position: fixed; inset: 0; background: rgba(10,11,14,.84); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 470px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card h2 { font-family: var(--display); font-size: 24px; margin: 0; text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; }
.card p { margin: 0; line-height: 1.5; color: var(--muted); }
.card ol, .card ul { margin: 0; padding-left: 20px; line-height: 1.6; display: flex; flex-direction: column; gap: 4px; }
.card .lead { color: var(--fg); font-size: 17px; }
.card .actions { display: flex; flex-direction: column; gap: 8px; }
.primary small { color: #5a4310; }
.primary { background: var(--amber); color: #2a1d00; border: 0; border-radius: 10px; padding: 12px 18px; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 0 #a87a14; }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #a87a14; }
.secondary { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.secondary small, .primary small { display: block; font-family: var(--body); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px; }
.big { font-family: var(--display); font-size: 40px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
:lang(th) .field label { letter-spacing: 0; }
.field-row { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 16px; }
.field input:focus-visible { outline: 3px solid var(--amber); outline-offset: 1px; }
.save { background: var(--amber); color: #2a1d00; border: 0; border-radius: 8px; padding: 0 14px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.save:disabled { opacity: .45; cursor: default; }
.note { font-size: 13px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.board { list-style: none; margin: 0; padding: 0 !important; display: flex; flex-direction: column; gap: 4px !important; }
.board li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--panel-2); font-variant-numeric: tabular-nums; }
.board li .rk { font-family: var(--display); font-weight: 700; color: var(--muted); }
.board li:nth-child(1) .rk { color: var(--amber); }
.board li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board li .nm small { color: var(--muted); margin-left: 6px; }
.board li .sc { font-family: var(--display); font-weight: 700; }
.board li.me { outline: 2px solid var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--panel-2)); }
.board .empty { display: block; background: none; color: var(--muted); padding: 4px 0; }
.share { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--display); white-space: pre-wrap; color: var(--fg); user-select: all; }

@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 520px) {
  .status { grid-template-columns: repeat(2, 1fr); }
  .btn { width: 74px; font-size: 10px; }
  .btn .face { width: 66px; height: 66px; border-width: 4px; }
  .btn .key { top: 52px; }
  .deck { gap: 14px; padding: 18px 10px; }
  .host { width: 66px; height: 66px; }
  .slot { width: 42px; height: 52px; }
  .slot .dot, .slot.filled .dot .mini { width: 26px; height: 26px; }
  .lock { margin-left: 0; flex: 1; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>Riddle <span>Panel</span></h1>
    <div class="top-actions">
      <button class="ghost" id="soundBtn" type="button"></button>
      <button class="ghost" id="langBtn" type="button"></button>
      <button class="ghost" id="howBtn" type="button" data-t="how"></button>
    </div>
  </div>

  <div class="stage">
    <div class="host" id="host">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="112" rx="40" ry="6" fill="rgba(0,0,0,.35)"/>
        <ellipse cx="60" cy="80" rx="44" ry="32" fill="var(--frog)"/>
        <ellipse cx="60" cy="90" rx="28" ry="18" fill="#bfe8a6"/>
        <circle cx="36" cy="44" r="17" fill="var(--frog)"/>
        <circle cx="84" cy="44" r="17" fill="var(--frog)"/>
        <circle cx="36" cy="43" r="11" fill="#fff"/>
        <circle cx="84" cy="43" r="11" fill="#fff"/>
        <circle cx="38" cy="45" r="5.5" fill="#1b1c22"/>
        <circle cx="82" cy="45" r="5.5" fill="#1b1c22"/>
        <ellipse class="lid" cx="36" cy="43" rx="12" ry="12" fill="var(--frog-dark)"/>
        <ellipse class="lid" cx="84" cy="43" rx="12" ry="12" fill="var(--frog-dark)"/>
        <path id="mouth" d="M38 70 Q60 86 82 70" stroke="#1b1c22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="30" cy="70" r="4" fill="#f59a9a" opacity=".7"/>
        <circle cx="90" cy="70" r="4" fill="#f59a9a" opacity=".7"/>
        <path d="M60 98 L46 90 L46 106 Z M60 98 L74 90 L74 106 Z" fill="#d6304a"/>
        <circle cx="60" cy="98" r="4" fill="#a81f36"/>
        <rect x="88" y="78" width="7" height="22" rx="3" fill="#2a2c34" transform="rotate(20 91 89)"/>
        <circle cx="96" cy="74" r="7" fill="#555a68"/>
      </svg>
    </div>
    <div class="bubble" role="status" aria-live="polite"><span class="who" id="hostName"></span><span id="hostLine"></span></div>
  </div>

  <div class="status">
    <div class="stat"><span class="k" id="kLevel"></span><span class="v" id="sLevel">1</span></div>
    <div class="stat"><span class="k" data-t="score"></span><span class="v" id="sScore">0</span></div>
    <div class="stat"><span class="k" data-t="lives"></span><span class="v lives" id="sLives">♥♥♥</span></div>
    <div class="stat"><span class="k" data-t="time"></span><span class="v" id="sTime">0.0</span></div>
  </div>
  <div class="timebar"><i id="tBar"></i></div>

  <div>
    <p class="section-label"><span data-t="riddles"></span><span id="bookCount"></span></p>
    <div class="rules" id="rules"></div>
  </div>

  <div class="lineup">
    <p class="section-label" style="margin:0"><span data-t="line"></span></p>
    <div class="slots" id="slots"></div>
    <div class="controls">
      <button class="ghost" id="undoBtn" type="button" data-t="undo"></button>
      <button class="ghost" id="clearBtn" type="button" data-t="clear"></button>
      <span class="kbd" id="kbdHint"></span>
      <button class="lock" id="lockBtn" type="button" data-t="lock"></button>
    </div>
  </div>

  <div class="deck" id="deck" aria-label="Buttons"></div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
const COLORS = {
  red:    { en: "Fox",     th: "จิ้งจอก",  v: "--c-red",    f: 262 },
  blue:   { en: "Whale",   th: "วาฬ",     v: "--c-blue",   f: 294 },
  green:  { en: "Turtle",  th: "เต่า",     v: "--c-green",  f: 330 },
  yellow: { en: "Chick",   th: "ลูกเจี๊ยบ", v: "--c-yellow", f: 392 },
  purple: { en: "Octopus", th: "ปลาหมึก",  v: "--c-purple", f: 440 },
  orange: { en: "Tiger",   th: "เสือ",     v: "--c-orange", f: 523 },
  pink:   { en: "Pig",     th: "หมู",      v: "--c-pink",   f: 587 },
  teal:   { en: "Parrot",  th: "นกแก้ว",   v: "--c-teal",   f: 659 },
  brown:  { en: "Bear",    th: "หมี",      v: "--c-brown",  f: 220 },
  white:  { en: "Rabbit",  th: "กระต่าย",  v: "--c-white",  f: 784 },
};
const ALL = Object.keys(COLORS);

let rand = Math.random;
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = n => Math.floor(rand() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    renderAll();
    say("tutWin", {}, "hop");
    setTimeout(() => showCard(menuView, menuHandlers), 1800);
    return;
  }
  S.rules.forEach(r => { if (r.shown) learn(r); });
  const bonus = Math.round(S.timeLeft * 4 * S.level) + (S.clean ? 25 * S.level : 0);
  S.score += 50 * S.level + bonus;
  renderAll();
  say("win", {}, "hop");
  setTimeout(() => {
    if (S.mode === "daily") {
      S.round++;
      if (S.round >= DAILY_LEVELS.length) return dailyOver(true);
      S.level = DAILY_LEVELS[S.round];
      loadRound(S.dailyRounds[S.round]);
      say("round", { n: S.round + 1, g: S.buttons.length, r: S.rules.length }, "hop");
    } else { S.level++; nextRound(); }
  }, 1700);
}

let cardState = null;
const LB = { db: null, user: null, uid: null, canWrite: null, ready: false };
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) return;
    LB.db = db; LB.user = user;
    if (user) {
      try { LB.uid = await user.id(); } catch (e) {}
      try { LB.canWrite = await user.can("data.write"); } catch (e) {}
    }
  } catch (e) {} finally { LB.ready = true; if (cardState && cardState.board) refreshBoard(); }
})();

const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cleanName = t => String(t || "").replace(/\s+/g, " ").trim().slice(0, 16);

function localBoard(mode, day) {
  return store.get("board", []).filter(r => r.mode === mode && (mode !== "daily" || r.day === day)).sort((a, b) => b.score - a.score).slice(0, 10);
}
function addLocal(entry) {
  const all = store.get("board", []);
  all.push(entry);
  const keep = [];
  ["show", "daily"].forEach(m => keep.push(...all.filter(r => r.mode === m).sort((a, b) => b.score - a.score).slice(0, 30)));
  store.set("board", keep);
}
async function sharedBoard(mode, day) {
  const col = LB.db.collection("scores");
  const q = mode === "daily"
    ? col.where("dailyKey", "==", day).orderBy("dailyScore", "desc").limit(10)
    : col.orderBy("best", "desc").limit(10);
  const snap = await q.get();
  return snap.docs.map(d => { const v = d.data() || {}; return { id: d.id, name: cleanName(v.name) || "?", score: mode === "daily" ? v.dailyScore : v.best, round: mode === "daily" ? v.dailyRounds : v.bestRound }; }).filter(r => typeof r.score === "number");
}
async function saveShared(entry) {
  if (!LB.db || !LB.uid) return "offline";
  if (LB.canWrite === false) return "readonly";
  try {
    const ref = LB.db.doc("scores/" + LB.uid);
    const snap = await ref.get();
    const prev = snap.exists ? { ...snap.data() } : {};
    const next = { ...prev, name: entry.name, updatedAt: Date.now() };
    let changed = prev.name !== entry.name;
    if (entry.mode === "show" && !(prev.best >= entry.score)) { next.best = entry.score; next.bestRound = entry.round; changed = true; }
    if (entry.mode === "daily" && (prev.dailyKey !== entry.day || !(prev.dailyScore >= entry.score))) { next.dailyKey = entry.day; next.dailyScore = entry.score; next.dailyRounds = entry.round; changed = true; }
    if (changed) await ref.set(next);
    return "ok";
  } catch (e) { return e && e.code === "invalid_argument" ? "readonly" : "fail"; }
}

function rowsHtml(rows, meTest, roundFmt) {
  if (!rows.length) return `<li class="empty">${T("lbEmpty")}</li>`;
  return rows.map((r, i) => `<li class="${meTest(r) ? "me" : ""}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.name)}<small>${r.round ? roundFmt(r.round) : ""}</small></span><span class="sc">${r.score}</span></li>`).join("");
}
let boardSeq = 0;
async function refreshBoard() {
  const st = cardState && cardState.board;
  const box = $("boardBox");
  if (!st || !box) return;
  const seq = ++boardSeq;
  const roundFmt = st.mode === "daily" ? n => T("rounds", n) : n => T("round", n);
  const local = localBoard(st.mode, st.day);
  const localHtml = `<p class="section-label" style="margin:0">${T("lbDevice")}</p><ol class="board">${rowsHtml(local, r => st.justSaved && r.t === st.justSaved, roundFmt)}</ol>`;
  const notes = st.note ? `<p class="note">${st.note}</p>` : "";
  if (!LB.ready) { box.innerHTML = `${notes}<p class="note">${T("lbLoading")}</p>${localHtml}`; return; }
  if (!LB.db) { box.innerHTML = `${notes}<p class="note">${T("lbOffline")}</p>${localHtml}`; return; }
  box.innerHTML = `${notes}<p class="section-label" style="margin:0">${T("lbEveryone")}</p><ol class="board"><li class="empty">${T("lbLoading")}</li></ol>${localHtml}`;
  const slow = setTimeout(() => { if (seq === boardSeq && $("boardBox")) { const ol = $("boardBox").querySelector(".board"); if (ol) ol.innerHTML = `<li class="empty">${T("lbSlow")}</li>`; } }, 10000);
  try {
    const rows = await sharedBoard(st.mode, st.day);
    clearTimeout(slow);
    if (seq !== boardSeq || !$("boardBox")) return;
    $("boardBox").querySelector(".board").innerHTML = rowsHtml(rows, r => r.id === LB.uid, roundFmt);
  } catch (e) {
    clearTimeout(slow);
    if (seq !== boardSeq || !$("boardBox")) return;
    $("boardBox").querySelector(".board").innerHTML = `<li class="empty">${T("lbOffline")}</li>`;
  }
}

function resultView(o) {
  return () => `
    <div class="card-top"><h2>${o.title}</h2>${langToggle()}</div>
    <div class="big">${o.score}</div>
    ${o.body}
    <div class="field">
      <label for="nick">${T("nameLabel")}</label>
      <div class="field-row"><input id="nick" maxlength="16" autocomplete="nickname" placeholder="${T("namePh")}" value="${esc(store.get("name", ""))}"><button class="save" id="saveScore" ${cardState && cardState.board && cardState.board.justSaved ? "disabled" : ""}>${cardState && cardState.board && cardState.board.justSaved ? T("saved") : T("save")}</button></div>
    </div>
    <div class="tabs" role="group">${o.mode === "daily" ? `<span class="tab" aria-pressed="true">${T("lbDaily", o.day)}</span>` : `<span class="tab" aria-pressed="true">${T("lbShow")}</span>`}</div>
    <div id="boardBox" style="display:flex;flex-direction:column;gap:8px"></div>
    ${o.extra || ""}
    <div class="actions">
      <button class="primary" id="again">${T("again")}</button>
      <button class="secondary" id="menu">${T("menu")}</button>
    </div>`;
}
function showResult(o) {
  const entry = { mode: o.mode, day: o.day, score: o.score, round: o.round };
  const handlers = {
    saveScore: () => {
      const name = cleanName($("nick").value);
      if (!name) { cardState.board.note = T("nameNeeded"); refreshBoard(); $("nick").focus(); return false; }
      store.set("name", name);
      const t = Date.now();
      cardState.board.justSaved = t;
      cardState.board.note = o.counts === false ? T("lbDailyRepeat") : "";
      if (o.counts !== false) addLocal({ ...entry, name, t });
      $("saveScore").disabled = true; $("saveScore").textContent = T("saved");
      refreshBoard();
      if (o.counts !== false) saveShared({ ...entry, name }).then(r => {
        if (r === "readonly") cardState && cardState.board && (cardState.board.note = T("lbReadOnly"));
        if (r === "fail") cardState && cardState.board && (cardState.board.note = T("lbSaveFail"));
        refreshBoard();
      });
      return false;
    },
    again: o.again,
    menu: () => showCard(menuView, menuHandlers),
    ...(o.handlers || {}),
  };
  showCard(resultView(o), handlers, { mode: o.mode, day: o.day, justSaved: null, note: "" });
  const nick = $("nick");
  if (nick && !nick.value) nick.focus();
}

function gameOver() {
  if (S.mode === "daily") return dailyOver(false);
  const newBest = S.score > best;
  if (newBest) { best = S.score; store.set("best", best); }
  say("over");
  showResult({
    mode: "show", day: todayKey(), score: S.score, round: S.level,
    title: T("lockedTitle"),
    body: `<p>${T("reached", S.level)} ${newBest ? T("newBest") : T("best", best)}</p>`,
    again: startShow,
  });
}
function dailyOver(done) {
  stopTimer(); S.playing = false;
  const rounds = done ? DAILY_LEVELS.length : S.round;
  const first = store.get("daily-" + S.dailyKey, null) === null;
  if (first) store.set("daily-" + S.dailyKey, S.score);
  const text = T("shareText", S.dailyKey, S.score, rounds, Math.max(0, S.lives));
  say("over");
  showResult({
    mode: "daily", day: S.dailyKey, score: S.score, round: rounds, counts: first,
    title: done ? T("dailyTitle") : T("dailyFail"),
    body: `<p>${T("shareLabel")}</p><div class="share" id="shareText">${text}</div>`,
    extra: `<button class="secondary" id="copy">${T("copy")}</button>`,
    again: startDaily,
    handlers: {
      copy: () => {
        const ok = () => { $("copy").textContent = T("copied"); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents($("shareText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copy").textContent = T("copyFail"); };
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
        return false;
      },
    },
  });
}

let lbMode = "show";
const leaderboardView = () => `
  <div class="card-top"><h2>${T("lbTitle")}</h2>${langToggle()}</div>
  <div class="tabs" role="group">
    <button class="tab" id="tabShow" aria-pressed="${lbMode === "show"}">${T("lbShow")}</button>
    <button class="tab" id="tabDaily" aria-pressed="${lbMode === "daily"}">${T("lbDaily", todayKey())}</button>
  </div>
  <div id="boardBox" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="actions"><button class="secondary" id="menu">${T("back")}</button></div>`;
function openLeaderboard(mode) {
  lbMode = mode || lbMode;
  showCard(leaderboardView, {
    tabShow: () => { openLeaderboard("show"); return false; },
    tabDaily: () => { openLeaderboard("daily"); return false; },
    menu: () => showCard(menuView, menuHandlers),
  }, { mode: lbMode, day: todayKey(), justSaved: null, note: "" });
}

function showCard(view, handlers, board) {
  stopTimer();
  const prevBoard = cardState && cardState.view === view ? cardState.board : null;
  cardState = { view, handlers, board: board === undefined ? prevBoard : board };
  $("card").innerHTML = view();
  $("overlay").hidden = false;
  for (const id in handlers) {
    const el = $(id);
    if (!el) continue;
    el.addEventListener("click", () => {
      const keep = handlers[id]() === false;
      if (!keep && cardState && cardState.view === view) { $("overlay").hidden = true; cardState = null; }
    });
  }
  const lc = $("langCard");
  if (lc) lc.addEventListener("click", toggleLang);
  const nk = $("nick");
  if (nk) nk.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const sv = $("saveScore"); if (sv && !sv.disabled) sv.click(); } });
  const first = $("card").querySelector(".primary");
  if (first) first.focus();
  if (cardState.board) refreshBoard();
}
const langToggle = () => `<button class="ghost" id="langCard" type="button">${T("switchTo")}</button>`;
const menuView = () => {
  const played = store.get("played", false);
  const dScore = store.get("daily-" + todayKey(), null);
  return `
  <div class="card-top"><h2>Riddle Panel</h2>${langToggle()}</div>
  ${T("howBody")}
  <div class="actions">
    <button class="${played ? "secondary" : "primary"}" id="mPractice">${T("practiceBtn")}<small>${T("practiceSub")}</small></button>
    <button class="${played ? "primary" : "secondary"}" id="mShow">${T("showBtn")}${played ? "" : `<small>${T("showSub")}</small>`}</button>
    <button class="secondary" id="mDaily">${T("dailyBtn")}<small>${dScore === null ? T("dailySub", todayKey()) : T("dailyDone", dScore)}</small></button>
    <button class="secondary" id="mBoard">${T("lbBtn")}<small>${T("lbSub")}</small></button>
  </div>
  <p>${T("best", best)}</p>`;
};
const menuHandlers = {
  mPractice: () => { store.set("played", true); startTutorial(); },
  mShow: () => { store.set("played", true); startShow(); },
  mDaily: () => { store.set("played", true); startDaily(); },
  mBoard: () => { openLeaderboard("show"); return false; },
};
const howView = () => `
  <div class="card-top"><h2>${T("how")}</h2>${langToggle()}</div>
  ${T("howBody")}
  <p class="kbd">${T("kbd")}</p>
  <div class="actions"><button class="primary" id="resume">${T("resume")}</button><button class="secondary" id="menu">${T("menu")}</button></div>`;

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  $("langBtn").textContent = T("switchTo");
  $("soundBtn").textContent = T("sound", !MUTED);
  $("hostName").textContent = T("host");
  if (S.lastLine) say(S.lastLine.key, S.lastLine.vars);
  if (S.buttons.length) renderAll(); else renderStatus();
  if (cardState && !$("overlay").hidden) {
    const typed = $("nick") ? $("nick").value : null;
    showCard(cardState.view, cardState.handlers, cardState.board);
    if (typed !== null && $("nick")) $("nick").value = typed;
  }
}
function toggleLang() { LANG = LANG === "en" ? "th" : "en"; store.set("lang", LANG); applyLang(); }
$("langBtn").addEventListener("click", toggleLang);
$("soundBtn").addEventListener("click", () => { MUTED = !MUTED; store.set("muted", MUTED); $("soundBtn").textContent = T("sound", !MUTED); if (!MUTED) tone(660); });
$("undoBtn").addEventListener("click", () => S.slots.length && removeAt(S.slots.length - 1));
$("clearBtn").addEventListener("click", () => { if (!S.playing) return; S.slots = []; S.badSlot = -1; S.broken = null; SFX.remove(); renderAll(); });
$("lockBtn").addEventListener("click", lockIn);
$("howBtn").addEventListener("click", () => {
  const wasPlaying = S.playing;
  if (wasPlaying) { S.playing = false; renderAll(); }
  showCard(howView, {
    resume: () => { if (wasPlaying) { S.playing = true; renderAll(); startTimer(); } else if (!S.buttons.length) showCard(menuView, menuHandlers); },
    menu: () => { S.playing = false; showCard(menuView, menuHandlers); },
  });
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("overlay").hidden) return;
  if (!S.playing) return;
  const k = e.key.toUpperCase();
  const i = KEYS.indexOf(k);
  if (i >= 0 && i < S.buttons.length && e.key.length === 1) {
    const b = S.buttons[i];
    if (!S.slots.includes(b.id)) {
      place(b);
      const el = document.querySelector(`.btn[data-id="${b.id}"]`);
      if (el) { el.classList.add("press"); setTimeout(() => el.classList.remove("press"), 120); }
    }
    e.preventDefault();
  } else if (e.key === "Backspace") { if (S.slots.length) removeAt(S.slots.length - 1); e.preventDefault(); }
  else if (e.key === "Enter") { lockIn(); e.preventDefault(); }
  else if (e.key === "Escape") { $("clearBtn").click(); }
});

(function init() {
  rand = seeded(7);
  S.mode = "show"; S.level = 1;
  const lv = makeLevel(1);
  rand = Math.random;
  S.buttons = lv.buttons; S.rules = lv.rules; S.slots = [S.buttons[0].id];
  S.timeMax = S.timeLeft = 32;
  applyLang();
  say("welcome", {}, "hop");
  tick();
  showCard(menuView, menuHandlers);
})();
</script>
</body>
</html>
